<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 3 - Jhanyn Concepcion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .card {
            width: 350px;
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 3px solid #12f7ff;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(18, 247, 255, 0.3);
        }

        .card img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #12f7ff;
            transition: 0.3s;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card h2 {
            margin-top: 1.5rem;
            color: #12f7ff;
            font-size: 1.8rem;
        }

        .card p {
            margin-top: 1rem;
            color: #333;
            line-height: 1.6;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: 0.4s;
        }

        .card:hover p {
            opacity: 1;
            max-height: 200px;
            margin-top: 1.5rem;
        }

        .card::before {
            content: "Hover to see more";
            display: block;
            margin-top: 1rem;
            color: #12f7ff;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .card:hover::before {
            opacity: 0;
        }

        @media (max-width: 768px) {
            .card { width: 300px; padding: 1.5rem; }
            .card img { width: 120px; height: 120px; }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .card {
                width: 100%;
                max-width: 300px;
                padding: 20px;
            }

            .card img {
                width: 110px;
                height: 110px;
                border: 3px solid #12f7ff;
            }

            .card h2 {
                font-size: 20px;
                margin-top: 15px;
            }

            .card p {
                font-size: 14px;
                line-height: 1.5;
            }

            .card::before {
                font-size: 12px;
                margin-top: 12px;
            }
        }

        /* Touch devices - show text always on small screens */
        @media (max-width: 480px) {
            .card p {
                opacity: 1;
                max-height: 200px;
                margin-top: 15px;
            }

            .card::before {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="../../assets/home.png" alt="Jhanyn Concepcion">
        <h2>Jhanyn Concepcion</h2>
        <p>I am an IT Student focused on web development, UI/UX design, and contributing to the tech field. Passionate about creating modern, responsive, and user-friendly web applications with creative solutions.</p>
    </div>
</body>
</html>
