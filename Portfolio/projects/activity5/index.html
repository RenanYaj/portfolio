<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 5 - Jhanyn Concepcion - Dark Mode Toggle</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    color: #333;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    transition: 0.3s;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    color: #667eea;
  }

  p {
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
    color: #555;
  }

  .image-container {
    margin: 2rem 0;
  }

  .image-container img {
    width: 250px;
    height: 250px;
    border: 4px solid #667eea;
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: 0.3s;
  }

  .image-container img:hover {
    transform: scale(1.05);
  }

  .dark-mode {
    background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
    color: #ecf0f1;
  }

  .dark-mode h1 {
    color: #3498db;
  }

  .dark-mode p {
    color: #bdc3c7;
  }

  .dark-mode .image-container img {
    border-color: #3498db;
  }

  button {
    margin-top: 1.5rem;
    padding: 15px 35px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    transition: 0.3s;
  }

  button:hover {
    background: #764ba2;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
  }

  button:active {
    transform: translateY(0);
  }

  .dark-mode button {
    background: #3498db;
  }

  .dark-mode button:hover {
    background: #2980b9;
  }
</style>
</head>

<body>
<h1>Jhanyn Concepcion</h1>
<p>Light and Dark Mode Toggle - Interactive Web Design</p>
<div class="image-container">
  <img src="../../assets/home.png" alt="Jhanyn Concepcion">
</div>

<button id="toggle-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>

<script>
  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
    
    // Update button text
    const btn = document.getElementById("toggle-btn");
    if (document.body.classList.contains("dark-mode")) {
      btn.textContent = "Switch to Light Mode";
    } else {
      btn.textContent = "Switch to Dark Mode";
    }
  }
</script>
</body>

</html>
